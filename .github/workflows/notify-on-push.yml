name: Notify on Push

on:
  push:
    branches: [ main ]

jobs:
  notify:
    name: Slack Push Notification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
              "text": ${{ toJSON(format('🚀 *New Push to Main*\n*Author:* {0}\n*Message:* {1}\n*Link:* {2}', github.actor, github.event.head_commit.message, github.event.head_commit.url)) }}
            }
        continue-on-error: true
