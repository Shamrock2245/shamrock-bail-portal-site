name: Assemble intake file

on:
  push:
    branches: [cursor/crm-intake-callers-24c1]
    paths:
      - .github/workflows/assemble-intake-file.yml

permissions:
  contents: write

jobs:
  assemble:
    name: Rebuild Shannon webhook from main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cursor/crm-intake-callers-24c1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild webhook from current main plus the CRM hunk
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- backend-gas/ElevenLabs_WebhookHandler.js
          python3 - << 'PY'
          import base64, pathlib, subprocess, sys
          b64 = """"""
          pathlib.Path("/tmp/webhook.patch").write_bytes(base64.b64decode(b64))
          subprocess.check_call(["git", "apply", "/tmp/webhook.patch"])
          diff = subprocess.check_output(
              ["git", "diff", "--numstat", "origin/main", "--", "backend-gas/ElevenLabs_WebhookHandler.js"],
              text=True,
          ).strip()
          add, delete, path = diff.split()
          if int(add) > 40 or int(delete) > 40:
              sys.exit("webhook diff is larger than the CRM hunk: " + diff)
          print("webhook diff", diff)
          PY
          git rm -f .github/workflows/assemble-intake-file.yml
          git add backend-gas/ElevenLabs_WebhookHandler.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore the full Shannon webhook with the CRM intake miss path."
          git push origin HEAD:cursor/crm-intake-callers-24c1
