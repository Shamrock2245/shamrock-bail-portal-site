name: PR CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Velo syntax and JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check Velo page and backend code
        run: node scripts/ci/check-velo-syntax.mjs

      - name: Validate JSON files
        run: node scripts/ci/check-json.mjs

      - name: CRM intake client checks
        run: node scripts/test_crm_intake_client.js

      - name: Portal check-in GAS sync checks
        run: node scripts/test_checkin_gas_sync.mjs

      - name: GAS post_slack_message requires the API key
        run: node scripts/test_gas_post_slack_message_auth.mjs

      - name: GAS doPost risk actions require the API key
        run: node scripts/test_gas_dopost_risk_actions_auth.mjs

      - name: GAS caller_context requires the API key
        run: node scripts/test_gas_caller_context_auth.mjs

      - name: GAS Telegram Slack alerts mask client name and phone
        run: node scripts/test_telegram_slack_mask.mjs
