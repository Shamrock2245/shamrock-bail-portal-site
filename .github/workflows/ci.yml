name: PR CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Velo syntax and JSON
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check Velo page and backend code
        run: node scripts/ci/check-velo-syntax.mjs

      - name: Validate JSON files
        run: node scripts/ci/check-json.mjs

      - name: CRM intake client checks
        run: node scripts/test_crm_intake_client.js

      - name: Portal check-in GAS sync checks
        run: node scripts/test_checkin_gas_sync.mjs

      - name: GAS post_slack_message requires the API key
        run: node scripts/test_gas_post_slack_message_auth.mjs

      - name: GAS doPost risk actions require the API key
        run: node scripts/test_gas_dopost_risk_actions_auth.mjs

      - name: GAS caller_context requires the API key
        run: node scripts/test_gas_caller_context_auth.mjs

      - name: GAS Telegram Slack alerts mask client name and phone
        run: node scripts/test_telegram_slack_mask.mjs

      - name: GAS Shannon transfer ring is four lines
        run: node scripts/test_gas_transfer_ring.mjs

      - name: GAS Telegram Mini App actions require the API key
        run: node scripts/test_gas_miniapp_actions_auth.mjs

      - name: First appearance router checks
        run: node scripts/test_first_appearance_router.js

      - name: Search Console county redirects and local facts
        run: node scripts/test_gsc_search_console.mjs

      - name: Sitemap index, public hours, and Lee copy
        run: node scripts/test_sitemap_schema_copy.mjs

      - name: Florida hub county anchor list
        run: node scripts/test_hub_county_anchors.mjs

      - name: Shannon helper unit tests
        run: node scripts/test_shannon_helpers.js

      - name: Bail cost calculator math
        run: node scripts/testing/test-bail-cost-calculator.mjs

      - name: City landing H1 pattern
        run: node --import ./scripts/testing/register-extensionless.mjs scripts/testing/test-city-hero-h1.mjs

      - name: Landing copy strips Fast Release
        run: node --import ./scripts/testing/register-extensionless.mjs scripts/testing/test-landing-fast-release.mjs

      - name: County FAQ repeater (ygoim)
        run: node --import ./scripts/testing/register-extensionless.mjs scripts/testing/test-county-faq-ygoim.mjs

      - name: JSON-LD structured data (T3)
        run: node --import ./scripts/testing/register-extensionless.mjs scripts/testing/test-jsonld-t3.mjs

      - name: Portal landing role selection and Bail School separation
        run: |
          if [ -f scripts/test_portal_landing_roles.mjs ]; then
            node scripts/test_portal_landing_roles.mjs
          else
            echo "Skipping portal landing role tests; scripts/test_portal_landing_roles.mjs is not on this branch."
          fi

